<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تحدي الأكل الصحي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdfbfc;--ink:#1c1b22;--card:#fff;--red:#8f082a;--teal:#1b8f8a;--pink:#f9e9ee;--mute:#5f5a63;--line:#e8e2e5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;min-height:100vh}
header{background:#fff;box-shadow:0 1px 8px rgba(0,0,0,.08);padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:1.7rem;color:var(--red);letter-spacing:.04em;border-bottom:4px solid var(--teal);line-height:1.1}
.hb{background:var(--red);color:#fff;border-radius:8px;padding:8px 18px;font-weight:700;font-size:.9rem}
main{width:100%;max-width:560px;margin:0 auto;padding:28px 20px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 22px;box-shadow:0 6px 24px rgba(143,8,42,.07)}
.tag{display:inline-block;background:var(--pink);color:var(--red);border-radius:6px;padding:4px 12px;font-size:.8rem;font-weight:700;margin-bottom:14px}
h1{font-size:2rem;line-height:1.5;margin:0 0 10px;font-weight:900}
p{line-height:1.9;margin:0 0 20px;color:var(--mute);font-size:1.05rem}
button{font:inherit;cursor:pointer;border:0}
.main{background:var(--red);color:#fff;font-weight:700;padding:13px 26px;border-radius:8px;width:100%;font-size:1.05rem}
.main:focus-visible,.opt:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:10px}
#sec{color:var(--red);font-size:1.3rem}
.bar{height:8px;background:var(--pink);border-radius:9px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;width:100%;background:var(--teal);transform-origin:right}
.bar.low i{background:var(--red)}
.q{font-size:1.35rem;font-weight:700;line-height:1.7;margin:0 0 18px}
.opt{display:block;width:100%;text-align:right;background:#fff;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:13px 16px;margin-bottom:10px;font-size:1.05rem}
.opt.ok{background:#e3f4f2;border-color:var(--teal);color:#0d5e5a}
.opt.no{background:var(--pink);border-color:var(--red);color:var(--red)}
.code{font-size:1.8rem;font-weight:900;letter-spacing:.12em;background:var(--pink);color:var(--red);border:2px dashed var(--red);border-radius:10px;padding:14px;text-align:center;margin:0 0 14px;direction:ltr;user-select:all}
</style>
</head>
<body>
<header><span class="hb">اطلب الآن</span><span class="logo">FLOD</span></header>
<main><div class="card" id="app"></div></main>
<script>
const CODE="HEALTHY20"; // غيّر كود الخصم من هنا
const TIME=15;
// [سؤال, الإجابة الصح, غلط, غلط]
const Q=[
["أي من دول أغنى في الألياف؟","الشوفان","الأرز الأبيض","العصير المصفى"],
["أي مصدر فيه دهون صحية؟","الأفوكادو","البطاطس المحمرة","الكيك"],
["أفضل مصدر للبروتين النباتي؟","العدس","الأرز الأبيض","الشيبسي"],
["كم كوب مياه تقريباً يحتاجه الشخص البالغ يومياً؟","حوالي 8 أكواب","كوبين","15 كوب"],
["أي منها غني بفيتامين سي؟","الفلفل الرومي","الأرز","الزبدة"],
["أي منها مصدر جيد للكالسيوم؟","اللبن والزبادي","الزيت","السكر"],
["أوميجا 3 موجود بكثرة في؟","السلمون والسردين","الدجاج المقلي","البطاطس"],
["أي منها غني بالحديد؟","السبانخ","الخيار","البطيخ"],
["أي طريقة طهي تحافظ على فيتامينات الخضار؟","البخار","القلي العميق","الغلي لساعة كاملة"],
["أفضل مشروب مع الوجبة؟","الماء","مشروب غازي","عصير معلب"],
["أي خبز أفضل صحياً؟","خبز القمح الكامل","الخبز الأبيض","الكرواسون"],
["أي منها مؤشره الجلايسيمي منخفض؟","الشوفان","البطاطس المهروسة","الأرز الأبيض"],
["أي منها يساعد على بناء العضلات؟","البيض","السكر","الزيت"],
["أي منها غني بالكاروتين المفيد للنظر؟","الجزر","الأرز","المكرونة"],
["أفضل مصدر طبيعي لفيتامين د؟","التعرض المعتدل للشمس","السكر","الملح"],
["الحد الأقصى للملح يومياً تقريباً؟","5 جرام (ملعقة صغيرة)","30 جرام","50 جرام"],
["أي نوع دهون يضر القلب أكثر؟","الدهون المتحولة","دهون الزيتون","دهون المكسرات"],
["أي منها مصدر للبروبيوتيك؟","الزبادي","السكر","الملح"],
["أي منها مصدر جيد للماغنيسيوم؟","اللوز والمكسرات","الصودا","الحلوى"],
["كم سعرة في جرام الدهون؟","9 سعرات","4 سعرات","2 سعر"],
["كم سعرة في جرام البروتين؟","4 سعرات","9 سعرات","12 سعرة"],
["أنسب زيت للسلطة؟","زيت الزيتون البكر","السمن","الزيت المهدرج"],
["الأكل ببطء يساعد على؟","الشعور بالشبع","زيادة الجوع","لا يفرق"],
["أكثر مصدر للسكر المضاف؟","المشروبات الغازية","التفاح","الخيار"],
["الألياف مفيدة لأنها؟","تساعد الهضم وتنظم السكر","ترفع الكوليسترول","تضعف المناعة"],
["أي منها غني بالبوتاسيوم؟","الموز","الزبدة","الدقيق الأبيض"],
["فيتامين ب12 موجود أساساً في؟","اللحوم والبيض والألبان","الفاكهة فقط","الخيار"],
["أفضل سناك بين الوجبات؟","حفنة مكسرات","شيبسي","بسكويت محشي"],
["أي منها خضار ورقية؟","الجرجير","البطاطس","الجزر"],
["الحمص غني بـ؟","البروتين والألياف","السكر فقط","الدهون المتحولة"],
["الأفضل صحياً؟","التفاحة كاملة","عصير التفاح المصفى","نفس الشيء تماماً"],
["عدد حصص الخضار والفاكهة المنصوح بها يومياً؟","5 حصص تقريباً","حصة في الأسبوع","20 حصة"],
["الشاي الأخضر غني بـ؟","مضادات الأكسدة","الدهون المشبعة","الصوديوم"],
["أفضل طريقة لطهي السمك؟","الشوي أو الفرن","القلي العميق","التمليح الزائد"]
];
const app=document.getElementById("app");
let picks,i,ok,timer,t0;
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);

function start(){
  app.innerHTML=`<span class="tag">تحدي الأكل الصحي</span><h1>جاوب صح واكسب خصم 20%</h1><p>3 أسئلة عشوائية، 15 ثانية لكل سؤال. جاوب على الثلاثة صح وخد كود خصم 20%.</p><button class="main" id="go">ابدأ التحدي</button>`;
  document.getElementById("go").onclick=()=>{picks=shuf(Q).slice(0,3);i=0;ok=0;show()};
}

function show(){
  const [q,...o]=picks[i];
  const opts=shuf(o);
  app.innerHTML=`<div class="top"><span>سؤال ${i+1} من 3</span><span id="sec">${TIME}</span></div>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <div class="q">${q}</div>${opts.map(x=>`<button class="opt">${x}</button>`).join("")}`;
  const btns=[...app.querySelectorAll(".opt")];
  btns.forEach(b=>b.onclick=()=>answer(b.textContent,btns));
  t0=Date.now();
  const fill=document.getElementById("fill"),sec=document.getElementById("sec"),bar=document.getElementById("bar");
  clearInterval(timer);
  timer=setInterval(()=>{
    const left=Math.max(0,TIME-(Date.now()-t0)/1000);
    fill.style.transform=`scaleX(${left/TIME})`;
    sec.textContent=Math.ceil(left);
    bar.classList.toggle("low",left<=5);
    if(left<=0){clearInterval(timer);answer(null,btns)}
  },100);
}

function answer(val,btns){
  clearInterval(timer);
  const right=picks[i][1];
  btns.forEach(b=>{b.disabled=true;if(b.textContent===right)b.classList.add("ok");else if(b.textContent===val)b.classList.add("no")});
  if(val===right)ok++;
  const fail=val!==right;
  setTimeout(()=>{ if(fail)end(val===null?"الوقت خلص":"إجابة غلط"); else if(++i<3)show(); else end(); },1100);
}

function end(reason){
  if(!reason){
    app.innerHTML=`<span class="tag">3 من 3</span><h1>برافو! إجابات كلها صح</h1><p>ده كود خصم 20% بتاعك:</p><div class="code">${CODE}</div><button class="main" id="cp">انسخ الكود</button>`;
    document.getElementById("cp").onclick=e=>{try{navigator.clipboard.writeText(CODE)}catch(_){}e.target.textContent="تم النسخ"};
  }else{
    app.innerHTML=`<h1>${reason}</h1><p>محتاج تجاوب على الثلاثة صح عشان تاخد الكود. جرب تاني بأسئلة جديدة.</p><button class="main" id="go">حاول مرة تانية</button>`;
    document.getElementById("go").onclick=()=>{picks=shuf(Q).slice(0,3);i=0;ok=0;show()};
  }
}
start();
</script>
</body>
</html>
